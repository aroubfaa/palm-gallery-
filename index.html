    <a href="#search" class="hero-btn">

<!-- ══════════════ SEARCH ══════════════ -->
<section class="search-section" id="search">
  <div class="container">
    <div class="search-top">
      <div>
        <p class="eyebrow">Browse the Gallery</p>
        <h2 class="section-title">Search Palm Photography</h2>
      </div>
    </div>

    <div class="pill-row" id="pillRow" role="tablist">
      <button class="pill active" data-q="date palm tree"     role="tab">Date Palm</button>
      <button class="pill"        data-q="coconut palm beach" role="tab">Coconut Palm</button>
      <button class="pill"        data-q="fan palm"           role="tab">Fan Palm</button>
      <button class="pill"        data-q="royal palm"         role="tab">Royal Palm</button>
      <button class="pill"        data-q="palm sunset"        role="tab">Palm Sunset</button>
      <button class="pill"        data-q="palm aerial view"   role="tab">Aerial View</button>
    </div>

    <!-- Search Form -->
    <form class="search-form" onsubmit="return false;">
      <div class="search-field">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search palm photography — e.g. date palm, palm beach, palm aerial…"
          autocomplete="off"
        />
        <button type="button" class="input-x hidden" id="clearInput">✕</button>
      </div>
      <div class="form-btns">
        <button type="button" class="btn-search" id="searchBtn">
          Search
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
        <button type="button" class="btn-clear" id="clearBtn">Clear</button>
      </div>
    </form>

    <div id="statusMsg" class="status-msg hidden" role="alert"></div>
  </div>
</section>

<!-- ══════════════ GALLERY ══════════════ -->
<section class="gallery-section hidden" id="gallerySection">
  <div class="container">
    <div class="gallery-bar">
      <h3 id="galleryTitle" class="gallery-title"></h3>
      <span id="galleryCount" class="gallery-count"></span>
    </div>
    <!-- Pinterest-style masonry grid -->
    <div class="masonry-grid" id="masonryGrid">
      <div class="masonry-col" id="col0"></div>
      <div class="masonry-col" id="col1"></div>
      <div class="masonry-col" id="col2"></div>
      <div class="masonry-col" id="col3"></div>
    </div>
    <div id="loadMoreWrap" class="load-more-wrap"></div>
  </div>
</section>

<!-- ══════════════ MODAL ══════════════ -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal-panel">
    <button class="modal-close" id="modalClose">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<!-- ══════════════ FOOTER ══════════════ -->
<footer class="footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <span class="footer-name">Palm <em>Gallery</em></span>
      <span class="footer-by">Photos by Pexels photographers</span>
    </div>
    <p class="footer-copy">
      Powered by <a href="https://www.pexels.com" target="_blank">Pexels API</a>
      &nbsp;·&nbsp; CCSW321 Web Development
    </p>
  </div>
</footer>

<script src="js/app.js"></script>
</body>
</html>
